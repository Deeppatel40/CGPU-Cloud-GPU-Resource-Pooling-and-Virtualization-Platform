# Least-privilege identity for the CGPU API (issue #12).
#
# The API only ever touches its own namespace and only these operations:
#   jobs:     create (launch), get/list (follow), delete (cancel / clean up)
#   pods:     get/list (status), pods/log get (logs)
#   secrets:  create/delete by name (per-job params + upload token). No get/list:
#             the API cannot read any Secret, including other jobs' tokens.
# It cannot touch nodes, other namespaces, RBAC, or the workloads' ServiceAccount token
# (workload pods run with automountServiceAccountToken: false).
#
# Apply on the control plane:  kubectl apply -f deploy/k8s/cgpu-api-rbac.yaml
# Then build the kubeconfig:   scripts/make-api-kubeconfig.sh
apiVersion: v1
kind: Namespace
metadata:
  name: cgpu-jobs
  labels:
    app.kubernetes.io/part-of: cgpu-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cgpu-api
  namespace: cgpu-jobs
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: cgpu-api-token
  namespace: cgpu-jobs
  annotations:
    kubernetes.io/service-account.name: cgpu-api
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cgpu-api
  namespace: cgpu-jobs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cgpu-api
  namespace: cgpu-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cgpu-api
subjects:
  - kind: ServiceAccount
    name: cgpu-api
    namespace: cgpu-jobs
