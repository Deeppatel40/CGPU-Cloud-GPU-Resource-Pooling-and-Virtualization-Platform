# Grafana for CGPU
# =============================================================================
# Pairs with prometheus.yaml. Datasource and dashboard are both provisioned from
# ConfigMaps, so a fresh pod comes up with the CGPU dashboard already present -
# nobody has to click through setup during a demo, and the dashboard is version
# controlled here rather than living only in a pod's filesystem.
#
# Owner / engineer: Deep Patel (@Deeppatel40)
#
# Apply (after prometheus.yaml):
#   kubectl apply -f deploy/monitoring/grafana.yaml
#   # then browse http://<any-node>:30300  (admin / admin on first login)
#
# The dashboard is built from the metric families cgpu-worker-agent and the
# scheduler actually export, so every panel below has a real series behind it:
#   cgpu_gpu_memory_total_mib / _allocatable_mib / _used_mib
#   cgpu_gpu_utilization_percent / _temperature_celsius / _power_draw_watts
#   cgpu_gpu_healthy / cgpu_gpu_active_jobs
#   cgpu_job_vram_used_bytes / _peak_bytes / _quota_bytes / _denials_total
#   cgpu_pool_total_nodes / _total_gpus / _vram_total_mib
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: cgpu-monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: CGPU-Prometheus
        type: prometheus
        access: proxy
        # In-cluster service DNS, so this keeps working wherever the pods land.
        url: http://prometheus.cgpu-monitoring.svc.cluster.local:9090
        isDefault: true
        jsonData:
          timeInterval: 15s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: cgpu-monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: cgpu
        orgId: 1
        folder: CGPU
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cgpu
  namespace: cgpu-monitoring
data:
  cgpu-overview.json: |
    {
      "uid": "cgpu-overview",
      "title": "CGPU — GPU Pool & Quota Enforcement",
      "tags": ["cgpu"],
      "timezone": "browser",
      "refresh": "15s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "type": "stat",
          "title": "Workers reporting telemetry",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "count(up{job=\"cgpu-worker-agent\"} == 1) or vector(0)" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "Pooled VRAM (MiB)",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "sum(cgpu_gpu_memory_total_mib)" }
          ]
        },
        {
          "type": "stat",
          "title": "Allocatable VRAM (MiB)",
          "description": "Total minus the per-GPU driver context reserve, which is what the scheduler may actually hand out.",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "sum(cgpu_gpu_memory_allocatable_mib)" }
          ]
        },
        {
          "type": "stat",
          "title": "Active jobs on GPUs",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "sum(cgpu_gpu_active_jobs) or vector(0)" }
          ]
        },
        {
          "type": "timeseries",
          "title": "GPU utilisation %",
          "description": "Two jobs sharing one GPU show as sustained high utilisation while each job's own throughput halves — the signature of time-slicing.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0, "max": 100 }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "cgpu_gpu_utilization_percent",
              "legendFormat": "{{node}} gpu{{gpu}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "VRAM used vs allocatable (MiB)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "decmbytes" } },
          "targets": [
            {
              "refId": "A",
              "expr": "cgpu_gpu_memory_used_mib",
              "legendFormat": "{{node}} used"
            },
            {
              "refId": "B",
              "expr": "cgpu_gpu_memory_allocatable_mib",
              "legendFormat": "{{node}} allocatable"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Per-job VRAM against quota",
          "description": "Reported by the allocation guard, not the driver: on WSL workers there is no per-process VRAM accounting, so the guard's tally is the only per-job signal.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "refId": "A",
              "expr": "cgpu_job_vram_used_bytes",
              "legendFormat": "{{job_id}} used"
            },
            {
              "refId": "B",
              "expr": "cgpu_job_vram_quota_bytes",
              "legendFormat": "{{job_id}} quota"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Quota denials (rate over 5m)",
          "description": "Non-zero means the guard refused an allocation. Expected during the quota demo; otherwise a job is sized above its reservation.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(cgpu_job_vram_denials_total[5m])",
              "legendFormat": "{{job_id}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "GPU temperature (°C) and power (W)",
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 20 },
          "targets": [
            {
              "refId": "A",
              "expr": "cgpu_gpu_temperature_celsius",
              "legendFormat": "{{node}} temp °C"
            },
            {
              "refId": "B",
              "expr": "cgpu_gpu_power_draw_watts",
              "legendFormat": "{{node}} power W"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cgpu-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: cgpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: cgpu
    spec:
      # Same reasoning as Prometheus: keep it off the laptops.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:11.5.1
          ports:
            - name: http
              containerPort: 3000
          env:
            # Left at the default admin/admin deliberately: this is a lab
            # cluster on a private LAN and a hardcoded "secret" in a public
            # repo would be worse than an obvious default. Change it with
            # GF_SECURITY_ADMIN_PASSWORD from a Secret if this is ever exposed.
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # Land straight on the CGPU dashboard instead of the empty home
            # page, so the demo does not start with navigation.
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/cgpu-overview.json
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard-cgpu
        - name: data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cgpu-monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
